# Ingest endpoint — ingest.ava-cyber.com -> backend port 3020
# Accepts logs from any client source (syslog relay, HTTP, webhooks)
server {
    listen 80;
    listen [::]:80;
    server_name ingest.ava-cyber.com;

    # Large payloads — batch log uploads can be big
    client_max_body_size 10m;

    access_log /var/log/nginx/ingest-access.log;
    error_log  /var/log/nginx/ingest-error.log;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }
}
